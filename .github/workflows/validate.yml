name: Validate source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            qpa: offscreen
          - os: windows-latest
            qpa: windows
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --disable-pip --no-deps -r requirements-desktop.txt
      - name: Prepare disposable Windows desktop and record native Qt geometry
        if: runner.os == 'Windows'
        run: python tests/windows_ci_desktop.py --configure
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/integration_local.py
      - run: node tests/test_start_stop.js
      - run: node tests/test_stream_analysis.js

  windows-installer:
    name: Build and verify Windows installer
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          python packaging/build_windows.py --iscc "$iscc"
      - name: Verify install, native GUI, reinstall and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/windows/*-Setup.exe | Select-Object -First 1
          if (!$setup) { throw 'Missing LinkRadar installer' }
          python packaging/smoke_windows_setup.py "$($setup.FullName)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/windows/*-Setup.exe
          archive: false
          if-no-files-found: error
